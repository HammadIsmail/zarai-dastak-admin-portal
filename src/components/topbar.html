<!-- Top Header Bar (Fixed / Sticky at Top) -->
<header class="h-16 px-6 border-b border-border bg-card/30 flex items-center justify-between shrink-0">
  <div class="flex items-center gap-3">
    <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden text-muted-foreground hover:text-foreground cursor-pointer">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    <h2 class="text-lg font-bold tracking-tight capitalize" x-text="currentTab.replace('_', ' ')"></h2>
  </div>

  <div class="flex items-center gap-3">
    <!-- Neo4j Live Indicator -->
    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[11px] text-emerald-400 font-medium">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Neo4j Live</span>
    </div>

    <!-- Refresh button -->
    <button @click="loadTabData()" class="btn-outline btn-sm cursor-pointer" title="Reload current section">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
      <span class="hidden sm:inline">Refresh</span>
    </button>
  </div>
</header>
