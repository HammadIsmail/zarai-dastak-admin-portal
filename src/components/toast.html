<!-- Toast Notifications (shadcn Toast Stack) -->
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  <template x-for="toast in toasts" :key="toast.id">
    <div class="pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-lg border shadow-lg transition-all transform duration-300"
         :class="{
           'bg-card border-border text-foreground': toast.type === 'info',
           'bg-emerald-950/90 border-emerald-800 text-emerald-100': toast.type === 'success',
           'bg-rose-950/90 border-rose-800 text-rose-100': toast.type === 'error',
           'bg-amber-950/90 border-amber-800 text-amber-100': toast.type === 'warning'
         }">
      <div class="flex items-center gap-2.5">
        <template x-if="toast.type === 'success'"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i></template>
        <template x-if="toast.type === 'error'"><i data-lucide="x-circle" class="w-4 h-4 text-rose-400"></i></template>
        <template x-if="toast.type === 'warning'"><i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i></template>
        <template x-if="toast.type === 'info'"><i data-lucide="help-circle" class="w-4 h-4 text-sky-400"></i></template>
        <p class="text-sm font-medium" x-text="toast.message"></p>
      </div>
      <button @click="removeToast(toast.id)" class="text-muted-foreground hover:text-foreground">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </template>
</div>
