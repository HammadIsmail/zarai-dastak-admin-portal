<!-- 6. Fleet & Vehicles -->
<div x-show="currentTab === 'vehicles' && !loading.vehicles" class="space-y-4">
  <div class="card-base p-4 flex flex-col md:flex-row items-center justify-between gap-3">
    <div class="input-icon-wrapper flex-1 w-full">
      <i data-lucide="search"></i>
      <input type="text" x-model="vehiclesFilter.search" @input.debounce.300ms="loadVehicles()"
             placeholder="Search by license plate, vehicle model, or owner…" class="input-base has-left-icon">
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto">
      <select x-model="vehiclesFilter.type" @change="loadVehicles()" class="select-base text-xs h-9 w-36 cursor-pointer">
        <option value="All">All Types</option>
        <option value="towing_truck">Towing Truck</option>
        <option value="crane">Crane</option>
        <option value="bulldozer">Bulldozer</option>
        <option value="dumper">Dumper</option>
        <option value="forklift">Forklift</option>
        <option value="harvester">Harvester</option>
        <option value="excavator">Excavator</option>
        <option value="sand_trolley">Sand Trolley</option>
      </select>

      <select x-model="vehiclesFilter.avail" @change="loadVehicles()" class="select-base text-xs h-9 w-32 cursor-pointer">
        <option value="All">Availability</option>
        <option value="Available">Available</option>
        <option value="Unavailable">Unavailable</option>
      </select>
    </div>
  </div>

  <div class="table-container">
    <table class="table-base">
      <thead class="table-header">
        <tr>
          <th class="table-head">Type</th>
          <th class="table-head">License Plate</th>
          <th class="table-head">Model & Year</th>
          <th class="table-head">Capacity</th>
          <th class="table-head">Provider</th>
          <th class="table-head">Availability</th>
          <th class="table-head">Verification</th>
          <th class="table-head text-right">Details</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="v in vehiclesList" :key="v.id">
          <tr class="table-row">
            <td class="table-cell font-medium capitalize" x-text="(v.vehicleType || '').replace('_', ' ')"></td>
            <td class="table-cell font-mono text-xs font-semibold" x-text="v.vehicleNumber"></td>
            <td class="table-cell text-xs" x-text="`${v.vehicleModel || '—'} (${v.vehicleYear || '—'})`"></td>
            <td class="table-cell text-xs text-muted-foreground" x-text="v.capacity || '—'"></td>
            <td class="table-cell text-xs" x-text="v.providerName || 'Unassigned'"></td>
            <td class="table-cell">
              <span class="badge-base"
                    :class="v.isAvailable ? 'badge-success' : 'badge-danger'"
                    x-text="v.isAvailable ? 'Available' : 'Busy / Off'"></span>
            </td>
            <td class="table-cell">
              <span class="badge-base"
                    :class="v.isVerified ? 'badge-info' : 'badge-warning'"
                    x-text="v.isVerified ? 'Verified' : 'Unverified'"></span>
            </td>
            <td class="table-cell text-right">
              <button @click="inspectVehicle(v.id)" class="btn-ghost btn-sm cursor-pointer">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
              </button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
