<!-- 12. Audit Logs -->
<div x-show="currentTab === 'audit' && !loading.audit" class="space-y-4">
  <div class="card-base p-4 flex items-center justify-between">
    <div>
      <h4 class="text-sm font-semibold">Security & Platform Audit Trail</h4>
      <p class="text-xs text-muted-foreground">Immutable history of administrative and critical platform operations</p>
    </div>
    <select x-model="auditLimit" @change="loadAuditLogs()" class="select-base text-xs h-9 w-32 cursor-pointer">
      <option value="20">Last 20 Events</option>
      <option value="50">Last 50 Events</option>
      <option value="100">Last 100 Events</option>
      <option value="200">Last 200 Events</option>
    </select>
  </div>

  <div class="card-base p-4 divide-y divide-border">
    <template x-for="log in auditLogs" :key="log.id">
      <div class="py-3 flex items-start justify-between gap-4">
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-muted text-muted-foreground flex items-center justify-center shrink-0">
            <i data-lucide="scroll-text" class="w-4 h-4"></i>
          </div>
          <div>
            <p class="text-sm font-medium">
              <strong class="text-foreground" x-text="log.actor"></strong>
              <span class="text-muted-foreground">&mdash;</span>
              <span class="text-foreground/90" x-text="log.detail"></span>
            </p>
            <p class="text-[11px] text-muted-foreground mt-0.5">
              <span class="uppercase font-mono text-[10px]" x-text="log.type"></span> &middot;
              ID: <code class="font-mono" x-text="(log.id || '').slice(0, 8)"></code> &middot;
              <span x-text="formatDateTime(log.timestamp)"></span>
            </p>
          </div>
        </div>
        <span class="badge-outline text-[11px]" x-text="log.status || 'event'"></span>
      </div>
    </template>
  </div>
</div>
