<!-- 2. Verifications Workflow -->
<div x-show="currentTab === 'verifications' && !loading.verifications" class="space-y-6">
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div>
      <h3 class="text-base font-semibold">Provider & Fleet Verifications</h3>
      <p class="text-xs text-muted-foreground">Approve or reject equipment operator applications and post-verification additions</p>
    </div>

    <!-- Sub Tabs -->
    <div class="tabs-list">
      <button @click="verifSubTab = 'providers'"
              class="tabs-trigger cursor-pointer"
              :class="verifSubTab === 'providers' && 'tabs-trigger-active'">
        Pending Providers (<span x-text="pendingProviders.length"></span>)
      </button>
      <button @click="verifSubTab = 'vehicles'"
              class="tabs-trigger cursor-pointer"
              :class="verifSubTab === 'vehicles' && 'tabs-trigger-active'">
        Post-Verification Vehicles (<span x-text="pendingVehicles.filter(v => !v.adminReviewed).length"></span>)
      </button>
    </div>
  </div>

  <!-- Tab 1: Pending Providers -->
  <div x-show="verifSubTab === 'providers'" class="space-y-4">
    <template x-if="pendingProviders.length === 0">
      <div class="card-base p-12 text-center">
        <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 mx-auto flex items-center justify-center mb-3">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
        <h4 class="font-semibold text-base">All Caught Up!</h4>
        <p class="text-xs text-muted-foreground mt-1">There are no provider verification requests pending review.</p>
      </div>
    </template>

    <template x-for="p in pendingProviders" :key="p.id">
      <div class="card-base p-5 border-l-4 border-l-amber-500">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-primary/20 text-primary border border-primary/30 flex items-center justify-center font-bold text-sm shrink-0">
              <span x-text="(p.name || 'P').slice(0, 2).toUpperCase()"></span>
            </div>
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <h4 class="font-bold text-base" x-text="p.name"></h4>
                <span class="badge-warning">Awaiting Review</span>
              </div>
              <div class="text-xs text-muted-foreground grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-1">
                <div><span class="text-muted-foreground/60">Email:</span> <span class="text-foreground font-medium" x-text="p.email"></span></div>
                <div><span class="text-muted-foreground/60">Phone:</span> <span class="text-foreground" x-text="p.phone"></span></div>
                <div><span class="text-muted-foreground/60">CNIC:</span> <span class="text-foreground" x-text="p.cnic || '—'"></span></div>
                <div><span class="text-muted-foreground/60">Applied:</span> <span class="text-foreground" x-text="formatDate(p.createdAt)"></span></div>
              </div>
            </div>
          </div>

          <!-- Actions & Document Triggers -->
          <div class="flex flex-wrap items-center gap-2">
            <button @click="openLightbox(p.cnicFrontImageBase64, 'CNIC Front — ' + p.name)"
                    :disabled="!p.cnicFrontImageBase64"
                    class="btn-outline btn-sm cursor-pointer">
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i> CNIC Front
            </button>
            <button @click="openLightbox(p.cnicBackImageBase64, 'CNIC Back — ' + p.name)"
                    :disabled="!p.cnicBackImageBase64"
                    class="btn-outline btn-sm cursor-pointer">
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i> CNIC Back
            </button>
            <button @click="openLightbox(p.licenseImageBase64, 'Driving License — ' + p.name)"
                    :disabled="!p.licenseImageBase64"
                    class="btn-outline btn-sm cursor-pointer">
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i> License
            </button>
            <button @click="openLightbox(p.vehicleImageBase64, 'Vehicle Photo — ' + p.name)"
                    :disabled="!p.vehicleImageBase64"
                    class="btn-outline btn-sm cursor-pointer">
              <i data-lucide="truck" class="w-3.5 h-3.5"></i> Vehicle
            </button>

            <div class="h-6 w-px bg-border mx-1"></div>

            <button @click="approveProvider(p.id)" class="btn-primary btn-sm bg-emerald-600 hover:bg-emerald-700 cursor-pointer">
              <i data-lucide="check" class="w-3.5 h-3.5"></i> Approve
            </button>
            <button @click="openRejectModal(p)" class="btn-destructive btn-sm cursor-pointer">
              <i data-lucide="x" class="w-3.5 h-3.5"></i> Reject
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Tab 2: Post-Verification Vehicles -->
  <div x-show="verifSubTab === 'vehicles'" class="space-y-4">
    <div class="table-container">
      <table class="table-base">
        <thead class="table-header">
          <tr>
            <th class="table-head">Vehicle Type</th>
            <th class="table-head">Plate Number</th>
            <th class="table-head">Owner / Provider</th>
            <th class="table-head">Documents</th>
            <th class="table-head">Review Status</th>
            <th class="table-head text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="v in pendingVehicles" :key="v.id">
            <tr class="table-row">
              <td class="table-cell font-medium capitalize" x-text="(v.vehicleType || '').replace('_', ' ')"></td>
              <td class="table-cell font-mono text-xs" x-text="v.vehicleNumber"></td>
              <td class="table-cell">
                <p class="font-medium" x-text="v.providerName"></p>
                <p class="text-xs text-muted-foreground" x-text="v.providerPhone"></p>
              </td>
              <td class="table-cell flex items-center gap-2">
                <button @click="openLightbox(v.vehicleImageBase64, 'Vehicle — ' + v.vehicleNumber)"
                        :disabled="!v.vehicleImageBase64"
                        class="btn-outline btn-sm py-1 h-7 cursor-pointer">
                  <i data-lucide="truck" class="w-3 h-3"></i> Photo
                </button>
                <button @click="openLightbox(v.vehicleLicenseImageBase64, 'Vehicle License — ' + v.vehicleNumber)"
                        :disabled="!v.vehicleLicenseImageBase64"
                        class="btn-outline btn-sm py-1 h-7 cursor-pointer">
                  <i data-lucide="file-text" class="w-3 h-3"></i> Document
                </button>
              </td>
              <td class="table-cell">
                <span class="badge-base"
                      :class="v.adminReviewed ? 'badge-success' : 'badge-warning'"
                      x-text="v.adminReviewed ? 'Reviewed' : 'Review Pending'"></span>
              </td>
              <td class="table-cell text-right">
                <button x-show="!v.adminReviewed"
                        @click="reviewVehicle(v.id)"
                        class="btn-outline btn-sm bg-primary/10 text-primary border-primary/20 hover:bg-primary/20 cursor-pointer">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i> Mark Reviewed
                </button>
                <span x-show="v.adminReviewed" class="text-xs text-muted-foreground font-medium">Archived</span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</div>
